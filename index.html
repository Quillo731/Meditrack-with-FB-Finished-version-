<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Medikamenten-Erinnerung</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1A1C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabletten">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --bg: #EDF2F0;
    --surface: #FFFFFF;
    --ink: #10262A;
    --muted: #4A6064;
    --line: #C5D3D0;
    --primary: #0E5F62;
    --on-primary: #FFFFFF;
    --done: #1B6E43;
    --on-done: #FFFFFF;
    --done-bg: #E1F2E8;
    --due: #8F4300;
    --due-bg: #FFEFD9;
    --late: #AD231B;
    --late-bg: #FCE6E3;
    --foil: #D3DFDC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C1A1C;
      --surface: #142629;
      --ink: #E9F2F0;
      --muted: #A2B8B5;
      --line: #2C4644;
      --primary: #62C7C2;
      --on-primary: #062A2B;
      --done: #7BD9A3;
      --on-done: #07240F;
      --done-bg: #163527;
      --due: #F5B56E;
      --due-bg: #3A2711;
      --late: #FF9E96;
      --late-bg: #40191A;
      --foil: #223A3B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C1A1C;
    --surface: #142629;
    --ink: #E9F2F0;
    --muted: #A2B8B5;
    --line: #2C4644;
    --primary: #62C7C2;
    --on-primary: #062A2B;
    --done: #7BD9A3;
    --on-done: #07240F;
    --done-bg: #163527;
    --due: #F5B56E;
    --due-bg: #3A2711;
    --late: #FF9E96;
    --late-bg: #40191A;
    --foil: #223A3B;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html {
    background: var(--bg);
    scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
    scroll-padding-bottom: 100px;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 18px/1.5 var(--font);
    -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 640px; margin: 0 auto; padding: 20px 16px 130px; }
  button, a.btn, .tab, select, input, textarea { touch-action: manipulation; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 6px; }

  /* Kopf */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .top > div:first-child { min-width: 0; }
  .greet { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2; }
  .date { margin: 2px 0 0; color: var(--muted); font-size: 17px; }
  .clock { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .warn { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--late); background: var(--late-bg); color: var(--late); font-weight: 700; }

  /* Navigation: untere Leiste, mit dem Daumen erreichbar */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    display: flex; gap: 8px;
    padding: 8px max(12px, calc((100vw - 640px) / 2)) calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1.5px solid var(--line);
  }
  .tab {
    flex: 1; min-height: 62px; padding: 6px 4px;
    border: 0; border-radius: 14px;
    background: transparent; color: var(--muted);
    font: 700 16px/1.2 var(--font); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .tab .ico { position: relative; display: block; height: 28px; }
  .tab[aria-current="page"] { background: var(--primary); color: var(--on-primary); }
  .badge {
    position: absolute; top: -6px; left: 16px;
    min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
    background: var(--late); color: var(--surface);
    font-size: 15px; line-height: 24px; text-align: center; border: 2px solid var(--surface);
  }
  .tab[aria-current="page"] .badge { border-color: var(--primary); }

  /* Statusfläche mit Blisterstreifen */
  .hero { border: 2px solid var(--line); border-radius: 20px; padding: 18px; background: var(--surface); margin-top: 16px; }
  .hero[data-tone="due"] { background: var(--due-bg); border-color: var(--due); }
  .hero[data-tone="late"] { background: var(--late-bg); border-color: var(--late); }
  .hero[data-tone="ok"] { background: var(--done-bg); border-color: var(--done); }
  .hero h2 { margin: 0; font-size: 30px; line-height: 1.15; }
  .hero[data-tone="due"] h2 { color: var(--due); }
  .hero[data-tone="late"] h2 { color: var(--late); }
  .hero[data-tone="ok"] h2 { color: var(--done); }
  .hero-sub { margin: 6px 0 0; color: var(--ink); }
  .hero-fam { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
  .blister { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; padding: 10px 12px; background: var(--foil); border-radius: 14px; }
  .pocket {
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); border: 2.5px solid transparent;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.22);
    font-weight: 700; font-size: 20px; line-height: 1;
  }
  .pocket.taken { background: var(--done); color: var(--on-done); box-shadow: none; }
  .pocket.due { border-color: var(--due); }
  .pocket.overdue { border-color: var(--late); color: var(--late); }
  .pocket.waiting { background: transparent; box-shadow: none; border: 2.5px dashed var(--muted); }

  /* Karten */
  .sec { margin: 26px 0 10px; font-size: 21px; font-weight: 700; line-height: 1.25; }
  .sec.first { margin-top: 12px; }
  .sec .count { color: var(--muted); font-weight: 400; font-size: 17px; margin-left: 6px; }
  .card {
    position: relative; overflow: hidden;
    margin: 0 0 12px; padding: 16px 16px 16px 24px;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 9px; background: var(--band, var(--line)); }
  .card.due { --band: var(--due); }
  .card.overdue { --band: var(--late); }
  .card.taken { --band: var(--done); }
  .card.waiting { --band: var(--muted); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card h3 { margin: 0; font-size: 23px; line-height: 1.25; overflow-wrap: anywhere; }
  .note { margin: 2px 0 0; color: var(--muted); font-size: 17px; overflow-wrap: anywhere; }
  .time { font-size: 23px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .state { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 14px; }
  .state svg { flex: none; margin-top: 3px; }
  .due .state { color: var(--due); font-weight: 700; }
  .overdue .state { color: var(--late); font-weight: 700; }
  .taken .state { color: var(--done); }
  .waiting .state { color: var(--muted); }
  .fam { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; color: var(--muted); font-size: 16px; }
  .fam svg { flex: none; margin-top: 2px; }
  .fam.ok { color: var(--done); }
  .fam.bad { color: var(--late); font-weight: 700; }

  /* Schaltflächen */
  .btn {
    min-height: 56px; padding: 0 22px;
    border: 2px solid var(--primary); border-radius: 14px;
    font: 700 19px var(--font);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; background: transparent; color: var(--primary); text-decoration: none;
  }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.primary.block { min-height: 62px; font-size: 21px; }
  .btn.block { width: 100%; }
  .btn.small { min-height: 46px; padding: 0 14px; font-size: 17px; }
  .btn.danger { border-color: var(--late); color: var(--late); }
  .btn.danger.fill { background: var(--late); color: var(--surface); }
  .btn.done { background: var(--done-bg); border-color: var(--done); color: var(--done); }
  .btn.wait { border: 2px dashed var(--line); color: var(--muted); }
  .btn:disabled { cursor: default; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .linkbtn { background: none; border: 0; padding: 0 4px; min-height: 44px; text-align: left; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .confirm { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--late-bg); border: 1.5px solid var(--late); }
  .confirm p { margin: 0 0 10px; font-weight: 700; color: var(--late); }

  /* Formular */
  .box { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 4px 16px 16px; }
  label { display: block; margin: 14px 0 6px; font-weight: 700; }
  input, textarea, select {
    width: 100%; min-height: 54px; padding: 12px 14px;
    border: 1.5px solid var(--muted); border-radius: 12px;
    background: var(--bg); color: var(--ink); font: inherit;
  }
  textarea { resize: vertical; min-height: 84px; }
  input.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
  .error { margin: 12px 0 0; color: var(--late); font-weight: 700; }
  .actions { margin-top: 16px; }
  .subh { margin: 20px 0 0; font-size: 19px; font-weight: 700; }

  .plist { list-style: none; margin: 0; padding: 0; }
  .plist li { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .plist .top-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .plist strong { font-size: 20px; overflow-wrap: anywhere; }
  .plist .acts { margin-top: 10px; }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 56px; padding: 8px 0; background: none; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
  .switch .track { flex: none; width: 58px; height: 34px; border-radius: 17px; background: var(--line); border: 2px solid var(--muted); position: relative; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); }
  .switch[aria-checked="true"] .track { background: var(--primary); border-color: var(--primary); }
  .switch[aria-checked="true"] .track::after { left: 27px; background: var(--on-primary); }

  details { margin-top: 14px; }
  summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
  .invite { margin: 8px 0 0; padding: 12px; border-radius: 10px; background: var(--bg); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
  .fine { margin: 26px 0 0; color: var(--muted); font-size: 16px; }

  /* Verlauf */
  .day { margin-bottom: 22px; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 8px; }
  .day-head h3 { margin: 0; font-size: 21px; }
  .day-head span { color: var(--muted); font-size: 16px; }
  .hlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; }
  .hlist li { display: flex; justify-content: space-between; gap: 14px; padding: 12px 16px; }
  .hlist li + li { border-top: 1.5px solid var(--line); }
  .hlist .n { font-weight: 700; overflow-wrap: anywhere; }
  .hlist .sub { color: var(--muted); font-size: 16px; }
  .hlist .r { text-align: right; white-space: nowrap; }
  .hlist .ok { color: var(--done); font-weight: 700; }
  .hlist .miss { color: var(--late); font-weight: 700; }

  .empty { background: var(--surface); border: 1.5px dashed var(--muted); border-radius: 16px; padding: 22px 18px; margin-top: 16px; }
  .empty h3 { margin: 0 0 6px; font-size: 22px; }
  .empty p { margin: 0 0 16px; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px));
    transform: translate(-50%, -16px); opacity: 0; pointer-events: none;
    max-width: min(92vw, 520px); padding: 12px 18px; border-radius: 12px;
    background: var(--ink); color: var(--bg); font-weight: 700; z-index: 20;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 430px) {
    .clock { font-size: 36px; }
    .greet { font-size: 22px; }
    .date { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    .btn:active:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 class="greet" id="greet">Medikamenten-Erinnerung</h1>
      <p class="date" id="date"></p>
    </div>
    <div class="clock" id="clock" aria-label="Aktuelle Uhrzeit"></div>
  </header>

  <div id="warn" class="warn" role="alert" hidden>
    Die Daten können in diesem Browser nicht dauerhaft gespeichert werden. Bitte nicht im privaten Modus verwenden und regelmäßig eine Sicherung anlegen.
  </div>

  <main>
    <section id="panel-today" aria-label="Heute"></section>
    <section id="panel-history" aria-label="Verlauf" hidden></section>
    <section id="panel-manage" aria-label="Tabletten verwalten" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Bereiche">
  <button class="tab" data-tab="today" id="tab-today">
    <span class="ico"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><span class="badge" id="badge" hidden></span></span>
    <span>Heute</span>
  </button>
  <button class="tab" data-tab="history" id="tab-history">
    <span class="ico"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9L4 8.5"/><path d="M4 4v4.5h4.5M12 7.5V12l3 2"/></svg></span>
    <span>Verlauf</span>
  </button>
  <button class="tab" data-tab="manage" id="tab-manage">
    <span class="ico"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-40 12 12)"/><path d="M9.3 8.3l6.4 7.4"/></svg></span>
    <span>Tabletten</span>
  </button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var KEY = 'medikamenten-erinnerung-v1';
  var TITLE = 'Medikamenten-Erinnerung';
  var DEFAULT_SERVER = 'https://ntfy.sh';

  /* ---------- Hilfsfunktionen ---------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmtT(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes(), 0, 0); }
  function dayWord(d, now) {
    var k = dkey(d);
    if (k === dkey(now)) return 'heute';
    if (k === dkey(addDays(now, -1))) return 'gestern';
    if (k === dkey(addDays(now, 1))) return 'morgen';
    return d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric' });
  }
  function dur(min) {
    if (min < 60) return min + ' Min.';
    var h = Math.floor(min / 60), m = min % 60;
    return h + ' Std.' + (m ? ' ' + m + ' Min.' : '');
  }
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var TIME_RE = /^\d{2}:\d{2}$/;
  var TOPIC_RE = /^[A-Za-z0-9_-]{1,64}$/;

  var ICON = {
    check: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    clock: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    alert: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.1"/></svg>'
  };

  /* ---------- Daten & Speicher ---------- */
  var storageOk = true;
  try {
    localStorage.setItem(KEY + '-test', '1');
    localStorage.removeItem(KEY + '-test');
  } catch (e) { storageOk = false; }

  function normalize(d) {
    var out = {
      name: '', pills: [], log: [],
      settings: { notify: false, ntfy: { on: false, server: DEFAULT_SERVER, topic: '', showNames: true } }
    };
    if (!d || typeof d !== 'object') return out;
    if (typeof d.name === 'string') out.name = d.name.slice(0, 60);
    if (Array.isArray(d.pills)) {
      out.pills = d.pills.filter(function (p) {
        return p && typeof p.name === 'string' && p.name.trim() && TIME_RE.test(p.time || '');
      }).map(function (p) {
        var o = {
          id: String(p.id || uid()),
          name: p.name.slice(0, 80),
          time: p.time,
          note: typeof p.note === 'string' ? p.note.slice(0, 200) : '',
          startDate: DATE_RE.test(p.startDate || '') ? p.startDate : dkey(new Date())
        };
        if (DATE_RE.test(p.activeFrom || '')) o.activeFrom = p.activeFrom;
        return o;
      });
    }
    if (Array.isArray(d.log)) {
      out.log = d.log.filter(function (l) {
        return l && typeof l.pillId === 'string' && DATE_RE.test(l.slotDate || '') && !isNaN(Date.parse(l.takenAt));
      }).map(function (l) {
        return {
          id: String(l.id || uid()),
          pillId: l.pillId,
          pillName: String(l.pillName || 'Tablette').slice(0, 80),
          slotDate: l.slotDate,
          slotTime: TIME_RE.test(l.slotTime || '') ? l.slotTime : '00:00',
          takenAt: l.takenAt,
          notify: ['pending', 'sent', 'failed'].indexOf(l.notify) >= 0 ? l.notify : 'off'
        };
      });
    }
    var s = d.settings;
    if (s && typeof s === 'object') {
      if (s.notify === true) out.settings.notify = true;
      var n = s.ntfy;
      if (n && typeof n === 'object') {
        out.settings.ntfy.on = n.on === true;
        if (typeof n.server === 'string' && /^https?:\/\/[^\s]+$/.test(n.server.trim())) out.settings.ntfy.server = n.server.trim().replace(/\/+$/, '');
        if (typeof n.topic === 'string' && TOPIC_RE.test(n.topic)) out.settings.ntfy.topic = n.topic;
        out.settings.ntfy.showNames = n.showNames !== false;
      }
    }
    return out;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) {}
    return normalize(null);
  }
  var data = load();

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      if (!storageOk) { storageOk = true; renderWarn(); }
    } catch (e) {
      if (storageOk) { storageOk = false; renderWarn(); }
    }
  }
  function renderWarn() { $('#warn').hidden = storageOk; }

  /* ---------- Einnahme-Logik ----------
     Jede Tablette hat pro Tag einen "Slot" zur festen Uhrzeit. Ein Slot gilt ab
     seiner Uhrzeit bis zur gleichen Uhrzeit am Folgetag. Pro Slot gibt es höchstens
     eine Bestätigung. Der Button wird also immer zur festen Uhrzeit frei –
     unabhängig davon, wann tatsächlich bestätigt wurde. */
  function slotFor(p, now) {
    var t = p.time.split(':').map(Number);
    var s = new Date(now.getFullYear(), now.getMonth(), now.getDate(), t[0], t[1], 0, 0);
    if (s > now) s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1, t[0], t[1], 0, 0);
    return s;
  }
  function nextSlotAfter(s, p) {
    var t = p.time.split(':').map(Number);
    return new Date(s.getFullYear(), s.getMonth(), s.getDate() + 1, t[0], t[1], 0, 0);
  }
  function findEntry(pillId, key) {
    for (var i = 0; i < data.log.length; i++) {
      if (data.log[i].pillId === pillId && data.log[i].slotDate === key) return data.log[i];
    }
    return null;
  }
  function pillState(p, now) {
    var slot = slotFor(p, now), key = dkey(slot), next = nextSlotAfter(slot, p);
    var entry = findEntry(p.id, key);
    if (entry) return { kind: 'taken', slot: slot, next: next, entry: entry };
    if (key < (p.activeFrom || p.startDate)) return { kind: 'waiting', slot: slot, next: next };
    var mins = Math.floor((now - slot) / 60000);
    return { kind: mins < 60 ? 'due' : 'overdue', slot: slot, next: next, mins: mins };
  }
  function getItems(now) {
    return data.pills.map(function (p) { return { p: p, st: pillState(p, now) }; });
  }
  function byTimeOfDay(a, b) { return a.p.time.localeCompare(b.p.time) || a.p.name.localeCompare(b.p.name, 'de'); }
  function isOpen(i) { return i.st.kind === 'due' || i.st.kind === 'overdue'; }

  /* ---------- Familien-Benachrichtigung über ntfy ----------
     Beim Bestätigen wird eine Push-Nachricht an einen ntfy-Kanal gesendet.
     Schlägt das Senden fehl (z. B. kein Internet), bleibt die Nachricht
     "ausstehend" und wird automatisch später erneut versucht. */
  function ntfyActive() { var c = data.settings.ntfy; return c.on && !!c.topic; }
  function newTopic() {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789', out = 'medi-', arr = new Uint32Array(24);
    try { crypto.getRandomValues(arr); } catch (e) { for (var k = 0; k < arr.length; k++) arr[k] = Math.floor(Math.random() * 4294967296); }
    for (var i = 0; i < arr.length; i++) out += chars.charAt(arr[i] % chars.length);
    return out;
  }
  function whoName() { return data.name.trim() || 'Die Person'; }
  function pillLabel(entry) {
    return data.settings.ntfy.showNames ? entry.pillName : 'die Tablette (geplant ' + entry.slotTime + ' Uhr)';
  }
  function takenMessage(entry) {
    var at = new Date(entry.takenAt);
    return { title: 'Tablette eingenommen', message: whoName() + ' hat ' + pillLabel(entry) + ' um ' + fmtT(at) + ' Uhr eingenommen.' };
  }
  function correctionMessage(entry) {
    var at = new Date(entry.takenAt);
    return { title: 'Korrektur', message: 'Korrektur: Die Meldung von ' + fmtT(at) + ' Uhr (' + pillLabel(entry) + ') wurde zurückgenommen. Sie war ein Versehen.' };
  }
  function ntfyPublish(m, tags, prio) {
    var c = data.settings.ntfy;
    // Offizielle ntfy-Methode: POST an https://server/kanal, Nachricht im Body.
    // Titel, Tags und Priorität stehen als URL-Parameter (so ist keine CORS-Vorabprüfung nötig).
    var url = c.server.replace(/\/+$/, '') + '/' + encodeURIComponent(c.topic) +
      '?title=' + encodeURIComponent(m.title) +
      '&tags=' + encodeURIComponent(tags.join(',')) +
      '&priority=' + prio;
    return new Promise(function (resolve, reject) {
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
      fetch(url, { method: 'POST', body: m.message, signal: ctrl ? ctrl.signal : undefined }).then(function (r) {
        clearTimeout(timer);
        if (r.ok) { resolve(); return; }
        var err = new Error('HTTP ' + r.status); err.kind = 'http'; err.status = r.status; reject(err);
      }, function (e) {
        clearTimeout(timer);
        var err = new Error(e && e.message ? e.message : 'Netzwerkfehler'); err.kind = 'net'; reject(err);
      });
    });
  }
  function explainError(err) {
    if (/claude\.(ai|com)|claudeusercontent/i.test(location.hostname)) {
      return 'Diese Seite läuft noch bei Claude. Dort ist das Senden an ntfy gesperrt. Bitte die Version verwenden, die Sie bei Netlify hochgeladen haben.';
    }
    if (err && err.kind === 'http') {
      if (err.status === 429) return 'ntfy meldet: zu viele Anfragen (Fehler 429). Bitte ein paar Minuten warten und noch einmal testen.';
      if (err.status === 400 || err.status === 404) return 'ntfy hat die Anfrage abgelehnt (Fehler ' + err.status + '). Bitte Kanalnamen und Serveradresse prüfen.';
      return 'ntfy hat mit einem Fehler geantwortet (Fehler ' + err.status + ').';
    }
    return 'Es gab keine Verbindung zu ' + data.settings.ntfy.server + '. Bitte Internetverbindung prüfen. Werbeblocker oder Datenschutz-Erweiterungen im Browser können das Senden ebenfalls blockieren.';
  }

  var inflight = {}, lastTry = {};
  function sendEntry(entry, force) {
    if (entry.notify !== 'pending') return;
    if (!ntfyActive()) { entry.notify = 'off'; save(); return; }
    if (inflight[entry.id]) return;
    if (!force && Date.now() - (lastTry[entry.id] || 0) < 30000) return;
    lastTry[entry.id] = Date.now();
    inflight[entry.id] = true;
    ntfyPublish(takenMessage(entry), ['white_check_mark'], 4).then(function () {
      entry.notify = 'sent';
    }, function () {
      if (Date.now() - Date.parse(entry.takenAt) > 48 * 3600 * 1000) entry.notify = 'failed';
    }).then(function () {
      delete inflight[entry.id];
      save();
      refreshToday();
    });
  }
  function retryPending(force) {
    data.log.forEach(function (e) { if (e.notify === 'pending') sendEntry(e, !!force); });
  }
  function refreshToday() { if (ui.tab === 'today') renderToday(); }

  /* ---------- UI-Zustand ---------- */
  var ui = {
    tab: 'today',
    confirmUndo: null,
    confirmDelete: null,
    confirmTopic: false,
    testResult: null,
    histFilter: 'all',
    form: { id: null, name: '', time: '08:00', note: '', error: '' },
    pendingRestore: null,
    backupText: ''
  };

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4500);
  }

  /* ---------- Aktionen ---------- */
  function take(id) {
    var p = data.pills.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var now = new Date();
    var st = pillState(p, now);
    if (st.kind !== 'due' && st.kind !== 'overdue') return; // nur einmal pro Slot
    var entry = {
      id: uid(), pillId: p.id, pillName: p.name,
      slotDate: dkey(st.slot), slotTime: p.time, takenAt: now.toISOString(),
      notify: ntfyActive() ? 'pending' : 'off'
    };
    data.log.push(entry);
    save();
    toast(p.name + ': Einnahme um ' + fmtT(now) + ' Uhr gespeichert.');
    renderActive();
    sendEntry(entry, true);
  }
  function undo(id) {
    var p = data.pills.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var st = pillState(p, new Date());
    if (st.kind !== 'taken') return;
    var entry = st.entry;
    data.log = data.log.filter(function (l) { return l.id !== entry.id; });
    ui.confirmUndo = null;
    save();
    if (entry.notify === 'sent' && ntfyActive()) {
      ntfyPublish(correctionMessage(entry), ['warning'], 3).then(function () {
        toast('Die Familie wurde über die Korrektur informiert.');
      }, function () {
        toast('Die Korrektur konnte nicht an die Familie gesendet werden.');
      });
    } else {
      toast('Die Bestätigung für ' + p.name + ' wurde zurückgenommen.');
    }
    renderActive();
  }
  function resend(id) {
    var p = data.pills.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var st = pillState(p, new Date());
    if (st.kind !== 'taken') return;
    if (!ntfyActive()) { toast('Die Benachrichtigung der Familie ist ausgeschaltet.'); return; }
    st.entry.notify = 'pending';
    save(); refreshToday();
    sendEntry(st.entry, true);
  }

  function newForm() { return { id: null, name: '', time: '08:00', note: '', error: '' }; }

  function savePill() {
    var f = ui.form, name = f.name.trim(), note = f.note.trim();
    if (!name) { f.error = 'Bitte einen Namen für die Tablette eingeben.'; renderManage('f-name'); return; }
    if (!TIME_RE.test(f.time)) { f.error = 'Bitte eine Einnahmezeit auswählen.'; renderManage('f-time'); return; }
    if (f.id) {
      var p = data.pills.filter(function (x) { return x.id === f.id; })[0];
      if (p) {
        if (p.time !== f.time) p.activeFrom = dkey(new Date()); // neue Zeit gilt ab heute
        p.name = name; p.time = f.time; p.note = note;
      }
      toast('„' + name + '“ wurde geändert.');
    } else {
      data.pills.push({ id: uid(), name: name, time: f.time, note: note, startDate: dkey(new Date()) });
      toast('„' + name + '“ wurde hinzugefügt.');
    }
    save();
    ui.form = newForm();
    renderManage('f-name');
    renderChrome();
  }
  function editPill(id) {
    var p = data.pills.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    ui.form = { id: p.id, name: p.name, time: p.time, note: p.note || '', error: '' };
    renderManage('f-name');
    var h = $('#form-h'); if (h) h.scrollIntoView({ block: 'start' });
  }
  function deletePill(id) {
    var p = data.pills.filter(function (x) { return x.id === id; })[0];
    data.pills = data.pills.filter(function (x) { return x.id !== id; });
    if (ui.form.id === id) ui.form = newForm();
    ui.confirmDelete = null;
    save();
    toast(p ? '„' + p.name + '“ wurde gelöscht. Der Verlauf bleibt erhalten.' : 'Gelöscht.');
    renderManage();
    renderChrome();
  }

  function toggleNotify() {
    if (typeof Notification === 'undefined') { toast('Benachrichtigungen sind in diesem Browser nicht verfügbar.'); return; }
    if (data.settings.notify) { data.settings.notify = false; save(); renderManage(); return; }
    var perm = Notification.permission;
    var done = function (p) {
      if (p === 'granted') {
        data.settings.notify = true; save();
        toast('Erinnerungen sind aktiv, solange diese Seite geöffnet ist.');
      } else {
        toast('Benachrichtigungen wurden nicht erlaubt. Das lässt sich in den Browser-Einstellungen ändern.');
      }
      renderManage();
    };
    if (perm === 'default') {
      try {
        var r = Notification.requestPermission(function (p) { done(p); });
        if (r && r.then) r.then(done, function () { done('denied'); });
      } catch (e) { done('denied'); }
    } else { done(perm); }
  }

  function toggleNtfy() {
    var c = data.settings.ntfy;
    if (c.on) {
      c.on = false;
      data.log.forEach(function (e) { if (e.notify === 'pending') e.notify = 'off'; });
      save(); renderManage(); renderChrome();
      toast('Die Familie wird nicht mehr automatisch benachrichtigt.');
      return;
    }
    if (!c.topic) c.topic = newTopic();
    c.on = true;
    save(); renderManage(); renderChrome();
    toast('Eingeschaltet. Bitte jetzt die Familie einladen und eine Testnachricht senden.');
  }
  function sendTest() {
    if (!ntfyActive()) return;
    ui.testResult = { kind: 'wait', text: 'Testnachricht wird gesendet …' };
    renderManage();
    ntfyPublish({ title: 'Testnachricht', message: 'Die Verbindung funktioniert. Sie werden hier benachrichtigt, sobald ' + (data.name.trim() || 'eine Person') + ' eine Tablette eingenommen hat.' }, ['bell'], 3)
      .then(function () {
        ui.testResult = { kind: 'ok', text: 'Gesendet: ntfy hat die Testnachricht angenommen. Sie sollte jetzt auf dem Handy erscheinen. Wenn nicht, liegt es an der ntfy-App: Kanalname prüfen und Benachrichtigungen erlauben.' };
      }, function (err) {
        ui.testResult = { kind: 'bad', text: 'Senden fehlgeschlagen. ' + explainError(err) };
      }).then(function () { if (ui.tab === 'manage') renderManage(); });
  }
  function inviteText() {
    var c = data.settings.ntfy, n = data.name.trim();
    return 'Hallo! Damit du sofort Bescheid weißt, wenn bei ' + (n || 'mir') + ' eine Tablette eingenommen wurde, richte bitte die kostenlose App „ntfy“ ein:\n\n' +
      '1. App „ntfy“ installieren (Android: Google Play oder F-Droid, iPhone: App Store).\n' +
      '2. In der App auf „+“ tippen und als Thema genau diesen Namen eingeben:\n' + c.topic + '\n' +
      (c.server !== DEFAULT_SERVER ? '   Server: ' + c.server + '\n' : '') +
      '3. Benachrichtigungen erlauben.\n\n' +
      'Der Name ist wie ein Passwort. Bitte nicht weitergeben.';
  }
  function copyText(text, okMsg) {
    var fallback = function () {
      var ok = false;
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
      toast(ok ? okMsg : 'Kopieren war nicht möglich. Bitte den Text von Hand markieren.');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }
  function shareInvite() {
    var text = inviteText();
    if (navigator.share) {
      navigator.share({ text: text }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        copyText(text, 'Einladungstext kopiert.');
      });
    } else { copyText(text, 'Einladungstext kopiert.'); }
  }

  /* ---------- Sicherung ---------- */
  function backupJson() {
    return JSON.stringify({
      app: 'medikamenten-erinnerung', version: 2, exportedAt: new Date().toISOString(),
      name: data.name, pills: data.pills, log: data.log, settings: data.settings
    }, null, 2);
  }
  function exportBackup() {
    var json = backupJson();
    var filename = 'medikamente-sicherung-' + dkey(new Date()) + '.json';
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast('Sicherung wird gespeichert.');
    } catch (e) {
      ui.backupText = json;
      renderManage();
      toast('Herunterladen war nicht möglich. Der Sicherungstext steht unten zum Kopieren bereit.');
      var d = $('#backup-details'); if (d) d.open = true;
    }
  }
  function tryRestore(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { toast('Das ist keine gültige Sicherung.'); return; }
    if (!obj || (!Array.isArray(obj.pills) && !Array.isArray(obj.log))) { toast('Das ist keine gültige Sicherung.'); return; }
    ui.pendingRestore = normalize(obj);
    renderManage();
    var c = $('#restore-confirm'); if (c) c.scrollIntoView({ block: 'center' });
  }

  /* ---------- Rendering ---------- */
  function renderHeader() {
    var now = new Date(), h = now.getHours();
    var hello = h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend';
    $('#greet').textContent = data.name.trim() ? hello + ', ' + data.name.trim() : hello;
    $('#date').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('#clock').textContent = fmtT(now);
  }

  function renderChrome() {
    var now = new Date(), items = getItems(now), nOpen = items.filter(isOpen).length;
    var b = $('#badge');
    b.hidden = nOpen === 0;
    b.textContent = nOpen;
    b.setAttribute('aria-label', nOpen + ' offen');
    document.title = nOpen > 0 ? '(' + nOpen + ') ' + TITLE : TITLE;
    ['today', 'history', 'manage'].forEach(function (t) {
      var el = $('#tab-' + t);
      if (t === ui.tab) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
      $('#panel-' + t).hidden = t !== ui.tab;
    });
    return items;
  }

  function famLine(entry, pillId) {
    var btn = '<button class="linkbtn" data-act="resend" data-id="' + esc(pillId) + '">Jetzt erneut senden</button>';
    if (entry.notify === 'sent') return '<p class="fam ok">' + ICON.check + '<span>Familie wurde benachrichtigt.</span></p>';
    if (entry.notify === 'pending') return '<p class="fam">' + ICON.clock + '<span>Nachricht an die Familie wird gesendet. Falls das nicht klappt, wird es automatisch erneut versucht.</span></p>' + btn;
    if (entry.notify === 'failed') return '<p class="fam bad">' + ICON.alert + '<span>Die Familie konnte nicht benachrichtigt werden.</span></p>' + btn;
    return '';
  }

  var lastTodayHtml = '';
  function cardHtml(i, now) {
    var p = i.p, st = i.st, k = st.kind;
    var head = '<div class="card-head"><div><h3>' + esc(p.name) + '</h3>' +
      (p.note ? '<p class="note">' + esc(p.note) + '</p>' : '') +
      '</div><div class="time">' + p.time + ' Uhr</div></div>';
    var body = '';
    if (k === 'due' || k === 'overdue') {
      var txt = k === 'due'
        ? 'Fällig seit ' + fmtT(st.slot) + ' Uhr.'
        : 'Überfällig seit ' + dayWord(st.slot, now) + ' ' + fmtT(st.slot) + ' Uhr.';
      body = '<p class="state">' + (k === 'due' ? ICON.clock : ICON.alert) + '<span>' + txt + '</span></p>' +
        '<button class="btn primary block" data-act="take" data-id="' + esc(p.id) + '">' + ICON.check + 'Eingenommen</button>';
    } else if (k === 'taken') {
      var at = new Date(st.entry.takenAt);
      var isToday = dkey(at) === dkey(now);
      var label = isToday ? 'Heute eingenommen' : 'Zuletzt eingenommen';
      body = '<p class="state">' + ICON.check + '<span>Bestätigt ' + dayWord(at, now) + ' um ' + fmtT(at) + ' Uhr (geplant ' + p.time + ' Uhr). ' +
        'Wieder verfügbar ' + dayWord(st.next, now) + ' um ' + fmtT(st.next) + ' Uhr.</span></p>' +
        '<button class="btn done block" disabled>' + ICON.check + label + '</button>' +
        famLine(st.entry, p.id);
      if (ui.confirmUndo === p.id) {
        body += '<div class="confirm"><p>Bestätigung wirklich zurücknehmen?' + (st.entry.notify === 'sent' ? ' Die Familie bekommt dann eine Korrektur.' : '') + '</p><div class="row">' +
          '<button class="btn small danger fill" data-act="undo-yes" data-id="' + esc(p.id) + '">Ja, zurücknehmen</button>' +
          '<button class="btn small" data-act="undo-no">Abbrechen</button></div></div>';
      } else {
        body += '<div><button class="linkbtn" data-act="undo" data-id="' + esc(p.id) + '">Versehentlich gedrückt? Rückgängig</button></div>';
      }
    } else {
      body = '<p class="state">' + ICON.clock + '<span>Noch nicht fällig. Erste Einnahme ' + dayWord(st.next, now) + ' um ' + fmtT(st.next) + ' Uhr.</span></p>' +
        '<button class="btn wait block" disabled>Noch nicht fällig</button>';
    }
    return '<article class="card ' + k + '">' + head + body + '</article>';
  }

  function renderToday() {
    var now = new Date(), items = getItems(now).sort(byTimeOfDay);
    var open = items.filter(isOpen).sort(function (a, b) { return a.st.slot - b.st.slot || byTimeOfDay(a, b); });
    var taken = items.filter(function (i) { return i.st.kind === 'taken'; });
    var later = items.filter(function (i) { return i.st.kind === 'waiting'; });
    var html = '';

    if (items.length === 0) {
      html = '<div class="empty"><h3>Noch keine Tabletten eingetragen</h3>' +
        '<p>Tragen Sie Name und Einnahmezeit Ihrer Tabletten ein. Danach sehen Sie hier jederzeit, was für heute noch offen ist.</p>' +
        '<button class="btn primary" data-act="goto-manage">Erste Tablette eintragen</button></div>';
    } else {
      var head, sub, tone;
      var nextUp = items.filter(function (i) { return !isOpen(i); })
        .sort(function (a, b) { return a.st.next - b.st.next; })[0];
      var nextTxt = nextUp ? 'Nächste Einnahme: ' + nextUp.p.name + ', ' + dayWord(nextUp.st.next, now) + ' um ' + fmtT(nextUp.st.next) + ' Uhr.' : '';
      if (open.length > 0) {
        head = open.length === 1 ? '1 Tablette offen' : open.length + ' Tabletten offen';
        var names = open.slice(0, 3).map(function (i) { return i.p.name; }).join(', ') + (open.length > 3 ? ' und weitere' : '');
        sub = 'Jetzt dran: ' + names + '.';
        tone = open.some(function (i) { return i.st.kind === 'overdue'; }) ? 'late' : 'due';
      } else if (later.length === 0) {
        head = 'Alles erledigt'; sub = nextTxt; tone = 'ok';
      } else {
        head = 'Im Moment ist nichts offen'; sub = nextTxt; tone = 'ok';
      }
      var pockets = items.map(function (i) {
        var k = i.st.kind, inner = k === 'taken' ? ICON.check : k === 'overdue' ? '!' : '';
        return '<span class="pocket ' + k + '">' + inner + '</span>';
      }).join('');
      html += '<section class="hero" data-tone="' + tone + '"><h2>' + head + '</h2><p class="hero-sub">' + esc(sub) + '</p>' +
        (ntfyActive() ? '<p class="hero-fam">Die Familie wird automatisch benachrichtigt.</p>' : '') +
        '<div class="blister" aria-hidden="true">' + pockets + '</div></section>';

      if (open.length) {
        html += '<h2 class="sec">Jetzt einnehmen<span class="count">' + open.length + '</span></h2>' + open.map(function (i) { return cardHtml(i, now); }).join('');
      }
      if (later.length) {
        html += '<h2 class="sec">Später<span class="count">' + later.length + '</span></h2>' + later.map(function (i) { return cardHtml(i, now); }).join('');
      }
      if (taken.length) {
        html += '<h2 class="sec">Eingenommen<span class="count">' + taken.length + '</span></h2>' + taken.map(function (i) { return cardHtml(i, now); }).join('');
      }
    }
    if (html !== lastTodayHtml) {
      $('#panel-today').innerHTML = html;
      lastTodayHtml = html;
    }
  }

  function renderHistory() {
    var now = new Date();
    var names = {};
    data.log.forEach(function (l) { names[l.pillId] = l.pillName; });
    data.pills.forEach(function (p) { names[p.id] = p.name; });

    var rows = [], seen = {};
    data.log.forEach(function (l) {
      seen[l.pillId + '|' + l.slotDate] = 1;
      rows.push({ date: l.slotDate, id: l.pillId, name: names[l.pillId], planned: l.slotTime, taken: l.takenAt });
    });
    var limit = addDays(new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0), -400);
    data.pills.forEach(function (p) {
      var curKey = dkey(slotFor(p, now));
      var d = parseKey(p.startDate);
      if (d < limit) d = limit;
      for (; dkey(d) < curKey; d = addDays(d, 1)) {
        var k = dkey(d);
        if (!seen[p.id + '|' + k]) rows.push({ date: k, id: p.id, name: p.name, planned: p.time, taken: null });
      }
    });

    var ids = Object.keys(names);
    if (ui.histFilter !== 'all' && !names[ui.histFilter]) ui.histFilter = 'all';
    if (ui.histFilter !== 'all') rows = rows.filter(function (r) { return r.id === ui.histFilter; });

    var byDate = {};
    rows.forEach(function (r) { (byDate[r.date] = byDate[r.date] || []).push(r); });
    var dates = Object.keys(byDate).sort().reverse();

    var html = '<h2 class="sec first">Einnahmeverlauf</h2>';
    if (ids.length > 1) {
      html += '<label for="hist-filter" class="sr-only">Nach Tablette filtern</label><select id="hist-filter" style="margin-bottom:16px">' +
        '<option value="all">Alle Tabletten</option>' +
        ids.sort(function (a, b) { return names[a].localeCompare(names[b], 'de'); }).map(function (id) {
          return '<option value="' + esc(id) + '"' + (ui.histFilter === id ? ' selected' : '') + '>' + esc(names[id]) + '</option>';
        }).join('') + '</select>';
    }
    if (dates.length === 0) {
      html += '<div class="empty"><h3>Noch keine Einnahmen</h3><p>Sobald eine Tablette als eingenommen bestätigt wird, erscheint sie hier mit Datum und Uhrzeit.</p></div>';
    }
    dates.forEach(function (dk) {
      var list = byDate[dk].sort(function (a, b) { return a.planned.localeCompare(b.planned) || a.name.localeCompare(b.name, 'de'); });
      var d = parseKey(dk), w = dayWord(d, now);
      var heading = (w === 'heute' || w === 'gestern') ? w.charAt(0).toUpperCase() + w.slice(1) :
        d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
      var nTaken = list.filter(function (r) { return r.taken; }).length;
      html += '<div class="day"><div class="day-head"><h3>' + esc(heading) + '</h3><span>' + nTaken + ' von ' + list.length + ' bestätigt</span></div><ul class="hlist">';
      list.forEach(function (r) {
        if (r.taken) {
          var at = new Date(r.taken), pl = parseKey(dk), t = r.planned.split(':').map(Number);
          pl = new Date(pl.getFullYear(), pl.getMonth(), pl.getDate(), t[0], t[1]);
          var diff = Math.round((at - pl) / 60000);
          var late = diff >= 1 ? dur(diff) + ' nach der Planzeit' : 'pünktlich';
          var atDay = dkey(at) !== dk ? ' (' + dayWord(at, now) + ')' : '';
          html += '<li><div><div class="n">' + esc(r.name) + '</div><div class="sub">Geplant ' + r.planned + ' Uhr</div></div>' +
            '<div class="r"><div class="ok">' + ICON.check.replace('width="22" height="22"', 'width="18" height="18" style="vertical-align:-3px"') + ' ' + fmtT(at) + ' Uhr' + esc(atDay) + '</div><div class="sub">' + late + '</div></div></li>';
        } else {
          html += '<li><div><div class="n">' + esc(r.name) + '</div><div class="sub">Geplant ' + r.planned + ' Uhr</div></div>' +
            '<div class="r"><div class="miss">Nicht bestätigt</div></div></li>';
        }
      });
      html += '</ul></div>';
    });
    $('#panel-history').innerHTML = html;
  }

  function byTimeOfDayPill(a, b) { return a.time.localeCompare(b.time) || a.name.localeCompare(b.name, 'de'); }

  function renderManage(focusId) {
    var f = ui.form, editing = !!f.id, c = data.settings.ntfy;
    var pills = data.pills.slice().sort(byTimeOfDayPill);
    var html = '';

    html += '<h2 class="sec first">Ihr Name</h2><div class="box">' +
      '<label for="f-person">Name der Person</label>' +
      '<input id="f-person" type="text" maxlength="60" autocomplete="given-name" data-field="person" value="' + esc(data.name) + '">' +
      '<p class="hint">Wird in der Begrüßung und in den Nachrichten an die Familie verwendet.</p></div>';

    html += '<h2 class="sec" id="form-h">' + (editing ? 'Tablette bearbeiten' : 'Neue Tablette') + '</h2><div class="box" id="pill-form">' +
      '<label for="f-name">Name der Tablette</label>' +
      '<input id="f-name" type="text" maxlength="80" placeholder="z. B. Ramipril 5 mg" data-field="name" value="' + esc(f.name) + '">' +
      '<label for="f-time">Einnahmezeit (täglich)</label>' +
      '<input id="f-time" type="time" data-field="time" value="' + esc(f.time) + '">' +
      '<label for="f-note">Weitere Angaben (optional)</label>' +
      '<textarea id="f-note" maxlength="200" placeholder="z. B. 1 Tablette, nach dem Frühstück" data-field="note">' + esc(f.note) + '</textarea>' +
      (f.error ? '<p class="error" role="alert">' + esc(f.error) + '</p>' : '') +
      '<div class="row actions"><button class="btn primary" data-act="save-pill">' + (editing ? 'Änderungen speichern' : 'Tablette speichern') + '</button>' +
      (editing ? '<button class="btn" data-act="cancel-edit">Abbrechen</button>' : '') + '</div></div>';

    html += '<h2 class="sec">Eingetragene Tabletten<span class="count">' + pills.length + '</span></h2>';
    if (!pills.length) {
      html += '<p class="hint">Noch keine Tabletten eingetragen.</p>';
    } else {
      html += '<ul class="plist">' + pills.map(function (p) {
        var conf = ui.confirmDelete === p.id
          ? '<div class="confirm"><p>„' + esc(p.name) + '“ wirklich löschen? Der bisherige Verlauf bleibt erhalten.</p><div class="row">' +
            '<button class="btn small danger fill" data-act="del-yes" data-id="' + esc(p.id) + '">Ja, löschen</button>' +
            '<button class="btn small" data-act="del-no">Abbrechen</button></div></div>'
          : '<div class="row acts"><button class="btn small" data-act="edit" data-id="' + esc(p.id) + '">Bearbeiten</button>' +
            '<button class="btn small danger" data-act="del" data-id="' + esc(p.id) + '">Löschen</button></div>';
        return '<li><div class="top-row"><div><strong>' + esc(p.name) + '</strong>' +
          (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') + '</div><div class="time">' + p.time + ' Uhr</div></div>' + conf + '</li>';
      }).join('') + '</ul>';
    }

    /* Familie informieren (ntfy) */
    html += '<h2 class="sec">Familie informieren</h2><div class="box">' +
      '<p class="hint" style="margin-top:14px">Sobald eine Tablette als eingenommen bestätigt wird, bekommt die Familie automatisch eine Push-Nachricht auf den Sperrbildschirm. Dafür wird der kostenlose Dienst ntfy.sh genutzt.</p>' +
      '<button class="switch" role="switch" aria-checked="' + c.on + '" data-act="ntfy-toggle"><span>Familie automatisch benachrichtigen</span><span class="track"></span></button>';
    if (c.on) {
      var invite = inviteText();
      var enc = encodeURIComponent(invite);
      html += '<label for="f-topic">Name des Kanals (wie ein Passwort behandeln)</label>' +
        '<input id="f-topic" class="mono" type="text" readonly value="' + esc(c.topic) + '">' +
        '<div class="row actions" style="margin-top:10px"><button class="btn small" data-act="topic-copy">Kopieren</button>' +
        (ui.confirmTopic ? '' : '<button class="btn small" data-act="topic-new">Neuen Namen erzeugen</button>') + '</div>';
      if (ui.confirmTopic) {
        html += '<div class="confirm"><p>Neuen Namen erzeugen? Die Familie muss den Kanal danach neu in der ntfy-App eintragen.</p><div class="row">' +
          '<button class="btn small danger fill" data-act="topic-new-yes">Ja, neu erzeugen</button>' +
          '<button class="btn small" data-act="topic-new-no">Abbrechen</button></div></div>';
      }
      html += '<button class="switch" role="switch" aria-checked="' + c.showNames + '" data-act="ntfy-names" style="margin-top:8px"><span>Medikamentennamen in der Nachricht anzeigen</span><span class="track"></span></button>' +
        '<div class="row actions"><button class="btn" data-act="ntfy-test">Testnachricht senden</button></div>' +
        (ui.testResult
          ? '<p class="' + (ui.testResult.kind === 'bad' ? 'error' : 'hint') + '" role="status" style="font-weight:700">' + esc(ui.testResult.text) + '</p>'
          : '<p class="hint">Bitte einmal testen: Die Nachricht sollte kurz danach auf dem Handy der Familie erscheinen.</p>') +
        '<p class="hint">Zum Gegenprüfen: <a href="' + esc(c.server.replace(/\/+$/, '') + '/' + c.topic) + '" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700">Kanal im Browser öffnen</a>. Dort erscheinen die Nachrichten ebenfalls.</p>' +
        '<h3 class="subh">Familie einladen</h3>' +
        '<p class="hint">Die Familie braucht die kostenlose App „ntfy“ und den Kanalnamen. Die Einladung enthält beides.</p>' +
        '<div class="row actions"><a class="btn small primary" href="https://wa.me/?text=' + enc + '" target="_blank" rel="noopener">WhatsApp</a>' +
        '<a class="btn small" href="mailto:?subject=' + encodeURIComponent('Einladung: Benachrichtigung über Tabletten-Einnahme') + '&body=' + enc + '">E-Mail</a>' +
        '<button class="btn small" data-act="invite-share">Teilen oder kopieren</button></div>' +
        '<details><summary>Einladungstext ansehen</summary><p class="invite">' + esc(invite) + '</p></details>' +
        '<details><summary>Erweitert</summary><label for="f-server">ntfy-Server</label>' +
        '<input id="f-server" type="url" inputmode="url" autocapitalize="none" spellcheck="false" data-field="server" value="' + esc(c.server) + '">' +
        '<p class="hint">Normalerweise nicht ändern. Nur nötig, wenn Sie einen eigenen ntfy-Server betreiben.</p></details>';
    }
    html += '</div>';

    html += '<h2 class="sec">Erinnerungen</h2><div class="box">';
    if (typeof Notification === 'undefined') {
      html += '<p class="hint" style="margin-top:14px">Benachrichtigungen sind in diesem Browser nicht verfügbar. Die Seite zeigt fällige Tabletten oben an.</p>';
    } else {
      html += '<button class="switch" role="switch" aria-checked="' + (data.settings.notify && Notification.permission === 'granted') + '" data-act="notify">' +
        '<span>Hinweis, wenn eine Tablette fällig wird</span><span class="track"></span></button>' +
        '<p class="hint">Funktioniert nur, solange diese Seite in einem Browser-Tab geöffnet ist.</p>';
    }
    html += '</div>';

    html += '<h2 class="sec">Datensicherung</h2><div class="box">' +
      '<p class="hint" style="margin-top:14px">Alle Daten liegen nur in diesem Browser auf diesem Gerät. Mit einer Sicherung lassen sie sich auf ein anderes Gerät übertragen oder nach dem Löschen der Browserdaten wiederherstellen.</p>' +
      '<div class="row actions"><button class="btn" data-act="export">Sicherung speichern</button>' +
      '<button class="btn" data-act="pick-file">Sicherung laden</button>' +
      '<input id="f-file" type="file" accept=".json,application/json" class="sr-only" tabindex="-1"></div>';
    if (ui.pendingRestore) {
      var pr = ui.pendingRestore;
      html += '<div class="confirm" id="restore-confirm"><p>Aktuelle Daten ersetzen? Die Sicherung enthält ' + pr.pills.length + ' Tabletten und ' + pr.log.length + ' Einnahmen.</p><div class="row">' +
        '<button class="btn small danger fill" data-act="restore-yes">Ja, ersetzen</button>' +
        '<button class="btn small" data-act="restore-no">Abbrechen</button></div></div>';
    }
    html += '<details id="backup-details"><summary>Sicherung als Text</summary>' +
      '<label for="f-backup" class="sr-only">Sicherungstext</label>' +
      '<textarea id="f-backup" data-field="backup" rows="5" spellcheck="false" placeholder="Sicherungstext hier einfügen oder erzeugen">' + esc(ui.backupText) + '</textarea>' +
      '<div class="row actions"><button class="btn small" data-act="make-text">Text erzeugen</button>' +
      '<button class="btn small" data-act="restore-text">Aus Text wiederherstellen</button></div></details></div>';

    html += '<p class="fine">Diese Erinnerungshilfe ersetzt keine ärztliche Beratung. Bitte Einnahmehinweise von Ärztin, Arzt oder Apotheke beachten.</p>';

    $('#panel-manage').innerHTML = html;
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
  }

  function renderActive() {
    renderHeader();
    renderChrome();
    if (ui.tab === 'today') renderToday();
    else if (ui.tab === 'history') renderHistory();
    else renderManage();
  }

  /* ---------- Erinnerungen im Browser & Takt ---------- */
  var notified = {};
  function checkNotify(items) {
    if (!data.settings.notify || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    items.forEach(function (i) {
      if (i.st.kind !== 'due' || i.st.mins > 10) return;
      var k = i.p.id + '|' + dkey(i.st.slot);
      if (notified[k]) return;
      notified[k] = 1;
      try {
        new Notification('Zeit für ' + i.p.name, {
          body: (i.p.note ? i.p.note + '. ' : '') + 'Geplant um ' + i.p.time + ' Uhr.', tag: k
        });
      } catch (e) {}
    });
  }
  function tick() {
    renderHeader();
    var items = renderChrome();
    if (ui.tab === 'today') renderToday();
    checkNotify(items);
    retryPending(false);
  }

  /* ---------- Ereignisse ---------- */
  document.addEventListener('click', function (e) {
    var tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) {
      ui.tab = tabBtn.getAttribute('data-tab');
      ui.confirmUndo = null; ui.confirmDelete = null; ui.confirmTopic = false;
      renderActive();
      window.scrollTo(0, 0);
      return;
    }
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    switch (act) {
      case 'take': take(id); break;
      case 'resend': resend(id); break;
      case 'undo': ui.confirmUndo = id; lastTodayHtml = ''; renderToday(); break;
      case 'undo-no': ui.confirmUndo = null; lastTodayHtml = ''; renderToday(); break;
      case 'undo-yes': undo(id); break;
      case 'goto-manage': ui.tab = 'manage'; renderActive(); window.scrollTo(0, 0); var n = $('#f-name'); if (n) n.focus(); break;
      case 'save-pill': savePill(); break;
      case 'cancel-edit': ui.form = newForm(); renderManage(); break;
      case 'edit': editPill(id); break;
      case 'del': ui.confirmDelete = id; renderManage(); break;
      case 'del-no': ui.confirmDelete = null; renderManage(); break;
      case 'del-yes': deletePill(id); break;
      case 'notify': toggleNotify(); break;
      case 'ntfy-toggle': toggleNtfy(); break;
      case 'ntfy-names': data.settings.ntfy.showNames = !data.settings.ntfy.showNames; save(); renderManage(); break;
      case 'ntfy-test': sendTest(); break;
      case 'topic-copy': copyText(data.settings.ntfy.topic, 'Kanalname kopiert.'); break;
      case 'topic-new': ui.confirmTopic = true; renderManage(); break;
      case 'topic-new-no': ui.confirmTopic = false; renderManage(); break;
      case 'topic-new-yes': data.settings.ntfy.topic = newTopic(); ui.confirmTopic = false; save(); renderManage(); toast('Neuer Kanalname erzeugt. Bitte die Familie neu einladen.'); break;
      case 'invite-share': shareInvite(); break;
      case 'export': exportBackup(); break;
      case 'pick-file': var fi = $('#f-file'); if (fi) fi.click(); break;
      case 'restore-no': ui.pendingRestore = null; renderManage(); break;
      case 'restore-yes':
        data = ui.pendingRestore; ui.pendingRestore = null; ui.form = newForm(); ui.histFilter = 'all';
        save(); toast('Sicherung wiederhergestellt.'); renderActive(); break;
      case 'make-text': ui.backupText = backupJson(); renderManage(); var dd = $('#backup-details'); if (dd) dd.open = true; break;
      case 'restore-text': tryRestore(ui.backupText); break;
    }
  });

  document.addEventListener('input', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-field');
    if (!f) return;
    var v = e.target.value;
    if (f === 'person') { data.name = v.slice(0, 60); save(); renderHeader(); }
    else if (f === 'name') { ui.form.name = v; ui.form.error = ''; }
    else if (f === 'time') { ui.form.time = v; ui.form.error = ''; }
    else if (f === 'note') { ui.form.note = v; }
    else if (f === 'backup') { ui.backupText = v; }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'hist-filter') { ui.histFilter = t.value; renderHistory(); }
    else if (t.id === 'f-server') {
      var v = t.value.trim().replace(/\/+$/, '');
      if (!v) v = DEFAULT_SERVER;
      if (/^https?:\/\/[^\s]+$/.test(v)) {
        data.settings.ntfy.server = v; save(); renderManage();
        toast('Server gespeichert. Bitte eine Testnachricht senden.');
      } else {
        toast('Bitte eine gültige Serveradresse eingeben, z. B. https://ntfy.sh');
        renderManage();
      }
    }
    else if (t.id === 'f-file' && t.files && t.files[0]) {
      var r = new FileReader();
      r.onload = function () { tryRestore(String(r.result)); };
      r.onerror = function () { toast('Die Datei konnte nicht gelesen werden.'); };
      r.readAsText(t.files[0]);
      t.value = '';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('#f-name, #f-time')) {
      e.preventDefault();
      savePill();
    }
  });

  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  window.addEventListener('online', function () { retryPending(true); });

  /* ---------- Start ---------- */
  renderWarn();
  renderActive();
  retryPending(true);
  setInterval(tick, 5000);
})();
</script>
</body>
</html>
